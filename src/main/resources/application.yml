spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: always

janja:
  bootstrap:
    admin:
      activation-code: ${ADMIN_CODE}

  jwt:
    secret: ${JWT_SECRET}
