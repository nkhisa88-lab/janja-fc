spring:
  datasource:
    url: jdbc:h2:file:./data/janja
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always

janja:
  bootstrap:
    admin:
      activation-code: ${ADMIN_CODE}

  jwt:
    secret: ${JWT_SECRET}
